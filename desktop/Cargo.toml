[package]
name = "snapper-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Local Windows capture and annotation with supervised media workers"
license = "MIT"

[dependencies]
anyhow = "=1.0.97"
ab_glyph = "=0.2.29"
arboard = "=3.5.0"
crossbeam-channel = "=0.5.15"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"] }
rfd = "=0.15.3"
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
tiny-skia = "=0.11.4"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "=24.0.5", default-features = false, features = ["dx12", "wgsl"] }
windows = { version = "=0.58.0", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Media_MediaFoundation",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance", "Win32_System_Threading", "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader", "Win32_System_Memory",
    "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem", "Win32_Security"
] }

[dev-dependencies]
tempfile = "=3.19.1"

[profile.release]
lto = "thin"
codegen-units = 8
strip = "debuginfo"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
